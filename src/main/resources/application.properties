#spring.application.name=meva_register_family

# Dados de conexao com o banco de dados
spring.datasource.url=jdbc:postgresql://localhost:5432/gym
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
#spring.config.import=optional:file:.env[.properties]

server.port=8081
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracoes do Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false


#app.cors.allowed-origins=http://localhost:5173,https://meva.com.br

